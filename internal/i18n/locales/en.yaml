web.setup.detection_note: "Absence and assignment: how HatRack tells what you work on."
grant.workdir.title: "Working directory and branch"
grant.workdir.lead: "Who works with Git often names branches after the ticket. The window rarely shows the branch in its title."
grant.workdir.what: "Which folder the program in the front window works in, such as a terminal, a development environment or an AI assistant. If the folder is in a Git repository, HatRack reads there only which branch is checked out. It reads no files, code or history of the repository."
grant.workdir.why: "A terminal often shows only its name in the title, a development environment project and file. Once the branch is known, say feature/ACME-101-login, HatRack assigns the time to the ticket ACME-101 without any setup."
grant.workdir.stores: "The name of the repository folder (never the whole path) and the branch, at the default level only if it holds the key of a ticket project HatRack knows. Other branch names are dropped."
grant.workdir.risk: "Folder and branch names can contain customer or product names."
grant.workdir.not_needed: "your window titles already show the ticket key because you set your tool up that way (see the toolbox)."
grant.workdir.level.known_keys: "only branches with a known ticket key"
grant.workdir.level.all: "all branches"
grant.ai_sessions.title: "Session files of Claude Code"
grant.ai_sessions.lead: "Helps when a terminal has several tabs and it cannot be told in which one Claude Code is working."
grant.ai_sessions.what: "Claude Code writes every session to a file on your computer. Besides the conversation it notes the folder and branch it works in. HatRack reads the last lines of the active session, keeps only folder and branch and drops everything else at once."
grant.ai_sessions.why: "Many terminals run all tabs in one program. Then HatRack sees several folders and cannot tell which tab is in front. The session file tells."
grant.ai_sessions.stores: "The same as for “Working directory and branch”. Conversation, prompts and answers are never stored, logged or passed on."
grant.ai_sessions.risk: "The file holds confidential conversations. HatRack has to open it to find the two values; a test makes sure nothing else is taken."
grant.ai_sessions.not_needed: "Claude Code runs in its own terminal window without tabs. Then “Working directory and branch” is enough."
grant.ai_sessions.level.on: "on"
