web.grants.title: "Permissions"
web.grants.lead: "What HatRack may see on your computers. The more you allow, the better it assigns your time; what feels too sensitive stays off. You decide per computer."
web.grants.never_title: "Your privacy comes first: HatRack never records what you type, say or see on the screen."
web.grants.never_text: "No keystrokes, no sound recording, no screenshots. To assign working time it is enough to know which program is in front. What you do in it is none of HatRack's business. No permission changes that."
web.grants.basics: "Basics"
web.grants.basics_sub: "App, window title and absence, once you switch the sensor on."
