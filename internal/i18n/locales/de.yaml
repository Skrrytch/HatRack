web.setup.detection_note: "Abwesenheit und Zuordnung: wie HatRack erkennt, woran du arbeitest."
grant.workdir.title: "Arbeitsverzeichnis und Branch"
grant.workdir.lead: "Wer mit Git arbeitet, nennt Branches oft nach dem Ticket. Das Fenster zeigt den Branch aber selten im Titel."
grant.workdir.what: "In welchem Ordner das Programm im vorderen Fenster gerade arbeitet, etwa ein Terminal, eine Entwicklungsumgebung oder ein KI-Assistent. Liegt der Ordner in einem Git-Repository, liest HatRack dort nur, welcher Branch ausgecheckt ist. Dateien, Code und Verlauf des Repositorys liest es nicht."
grant.workdir.why: "Ein Terminal zeigt oft nur seinen Namen im Titel, eine Entwicklungsumgebung Projekt und Datei. Steht der Branch fest, etwa feature/ACME-101-login, ordnet HatRack die Zeit dem Ticket ACME-101 zu, ohne dass du etwas einstellst."
grant.workdir.stores: "Der Name des Repository-Ordners (nie der ganze Pfad) und der Branch, in der Standardstufe nur, wenn er den Schlüssel eines Ticket-Projekts enthält, das HatRack kennt. Andere Branch-Namen werden verworfen."
grant.workdir.risk: "Ordner- und Branch-Namen können Kunden- oder Produktnamen enthalten."
grant.workdir.not_needed: "deine Fenstertitel den Ticketschlüssel schon zeigen, weil du dein Werkzeug so eingestellt hast (siehe Werkzeugkasten)."
grant.workdir.level.known_keys: "nur Branches mit bekanntem Ticketschlüssel"
grant.workdir.level.all: "alle Branches"
grant.ai_sessions.title: "Sitzungsdateien von Claude Code"
grant.ai_sessions.lead: "Hilft, wenn ein Terminal mehrere Tabs hat und nicht zu erkennen ist, in welchem Claude Code gerade arbeitet."
grant.ai_sessions.what: "Claude Code schreibt jede Sitzung in eine Datei auf deinem Rechner. Darin steht neben dem Gespräch auch, in welchem Ordner und Branch es arbeitet. HatRack liest die letzten Zeilen der aktiven Sitzung, behält nur Ordner und Branch und verwirft alles andere sofort."
grant.ai_sessions.why: "Viele Terminals führen alle Tabs in einem einzigen Programm. Dann sieht HatRack mehrere Ordner und kann nicht sagen, welcher Tab vorne ist. Die Sitzungsdatei sagt es."
grant.ai_sessions.stores: "Dasselbe wie bei „Arbeitsverzeichnis und Branch“. Gespräch, Eingaben und Antworten werden nie gespeichert, protokolliert oder weitergegeben."
grant.ai_sessions.risk: "Die Datei enthält vertrauliche Gespräche. HatRack muss sie öffnen, um die zwei Angaben zu finden; ein Test stellt sicher, dass nichts anderes übernommen wird."
grant.ai_sessions.not_needed: "Claude Code in einem eigenen Terminalfenster ohne Tabs läuft. Dann reicht „Arbeitsverzeichnis und Branch“."
grant.ai_sessions.level.on: "an"
