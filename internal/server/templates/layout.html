{{define "icon"}}<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">{{if eq . "left"}}<path d="M15 5l-7 7 7 7"/>{{else if eq . "right"}}<path d="M9 5l7 7-7 7"/>{{else if eq . "up"}}<path d="M5 15l7-7 7 7"/>{{else if eq . "down"}}<path d="M5 9l7 7 7-7"/>{{else if eq . "back"}}<path d="M20 12H5M11 5l-7 7 7 7"/>{{else if eq . "undo"}}<path d="M9 15L4 10l5-5"/><path d="M4 10h10a6 6 0 0 1 0 12h-3"/>{{else if eq . "edit"}}<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>{{else if eq . "restore"}}<path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/>{{end}}</svg>{{end}}
{{define "layout"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HatRack</title>
<link rel="icon" type="image/svg+xml" href="/static/hatrack.svg">
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fafafa; --card: #fff; --line: #0002; --dim: #0009; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #161618; --card: #202023; --line: #fff2; --dim: #fff9; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; align-items: center; gap: 1.2rem; padding: .6rem 1.2rem; border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
  header nav { display: flex; gap: .3rem; }
  header a { color: inherit; text-decoration: none; padding: .2rem .6rem; border-radius: .4rem; }
  header a.on { background: var(--line); font-weight: 600; }
  header .sp { flex: 1; }
  header form { margin: 0; }
  main { max-width: 56rem; margin: 1.5rem auto; padding: 0 1rem; }
  h1 { font-size: .9rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 2rem 0 .6rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: .7rem; padding: 1rem 1.2rem; }
  .dim { color: var(--dim); }
  .err { background: #c334; border: 1px solid #c33; border-radius: .5rem; padding: .5rem .9rem; margin-bottom: 1rem; }
  button, .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: .5rem; background: var(--card); color: inherit; padding: .25rem .8rem; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--dim); }
  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; line-height: 1.4; }
  .ico { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .iconbtn { padding: .3rem .45rem; }
  .hero { font-size: 2.4rem; font-weight: 700; line-height: 1.2; border-left: .5rem solid var(--c, #888); padding-left: 1rem; }
  .hero small { font-size: 1.1rem; font-weight: 400; color: var(--dim); }
  .sub { font-size: 1.3rem; margin: .2rem 0 0 1.5rem; }
  .meta { margin: .2rem 0 0 1.5rem; color: var(--dim); }
  .rack { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  .hatcard { padding: .6rem .8rem .8rem; }
  .hatcard.cur { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
  .hatcard form { display: inline; margin: 0; }
  .hathead { display: flex; align-items: center; gap: .3rem; }
  .hathead form { display: block; }
  .hatbtn { display: flex; align-items: center; gap: .1rem; width: 100%; text-align: left; border: 0; background: none; padding: .3rem .4rem; border-radius: .5rem; font-weight: 600; font-size: 1.1rem; }
  button.hatbtn:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
  .badge { margin-left: auto; font-size: .75rem; font-weight: 600; background: var(--c); color: var(--ink, #fff); border-radius: 1rem; padding: 0 .55rem; }
  .edit { color: var(--dim); text-decoration: none; padding: .2rem .45rem; border-radius: .4rem; }
  .edit:hover { background: var(--line); color: var(--fg); }
  .chips { display: flex; flex-wrap: wrap; gap: .3rem; margin: .3rem 0 0 .4rem; }
  .chips button, .chip { padding: .05rem .7rem; font-size: .9rem; border-radius: 1rem; border: 1px solid var(--line); }
  .chips button:hover { background: color-mix(in srgb, var(--c) 25%, var(--card)); }
  .chips button.cur, .chip.cur { background: var(--c); color: var(--ink, #fff); border-color: var(--c); font-weight: 600; }
  .status { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; justify-content: space-between; background: color-mix(in srgb, var(--c) 22%, var(--card)); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: .9rem; padding: 1rem 1.2rem; }
  .status-main { display: flex; align-items: center; gap: .9rem; }
  .bigdot { width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fg) 25%, transparent); flex: none; }
  .status-hat { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
  .status-act { font-weight: 400; }
  .status-tools { display: flex; gap: .4rem; }
  .status-tools form { margin: 0; }
  button.tool { padding: .45rem .9rem; font-weight: 600; }
  .hint { color: var(--dim); font-size: .85rem; margin: .4rem .2rem 0; }
  a.plain { color: inherit; text-decoration: none; }
  a.plain:hover { text-decoration: underline; }
  .today { display: grid; gap: .35rem; }
  .trow { display: grid; grid-template-columns: minmax(6rem, 12rem) 1fr 5rem; gap: .8rem; align-items: center; }
  .tbar { height: .55rem; background: var(--line); border-radius: .3rem; overflow: hidden; }
  .tbar i { display: block; height: 100%; background: var(--c); border-radius: .3rem; }
  .bar { position: relative; height: 1.8rem; background: var(--line); border-radius: .4rem; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; background: var(--c); min-width: 2px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: .3rem .5rem; text-align: left; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: var(--c, #999); margin-right: .45em; }
  .on-dot { background: #3a3; }
  .nav2 { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  .nav2 .t { flex: 1; text-align: center; font-weight: 600; }
  .daybar { display: grid; grid-template-columns: 6.5rem 1fr 5rem; gap: .6rem; align-items: center; margin: .25rem 0; }
  .hours { display: flex; justify-content: space-between; font-size: .75rem; color: var(--dim); margin-top: .1rem; }
  input[type=password] { font: inherit; padding: .4rem .6rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--bg); color: inherit; width: 100%; }
  .login { max-width: 22rem; margin: 4rem auto; }
  input[type=text], input[type=number], select, textarea { font: inherit; padding: .35rem .6rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--bg); color: inherit; }
  textarea { width: 100%; font-family: ui-monospace, monospace; font-size: .9rem; }
  input[type=color] { width: 2.6rem; height: 2.1rem; padding: .1rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--bg); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: #2fa7e0; border-color: #2fa7e0; color: #fff; font-weight: 600; }
  .ok { background: #3a34; border: 1px solid #3a3; border-radius: .5rem; padding: .5rem .9rem; margin-bottom: 1rem; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .4rem 0; }
  .grow { flex: 1; }
  .fields { display: grid; gap: .8rem 1rem; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }
  .fields label { display: flex; flex-direction: column; gap: .2rem; font-size: .9rem; color: var(--dim); }
  .fields label > * { color: var(--fg); }
  label.inline { display: inline-flex; gap: .3rem; align-items: center; }
  table.list td { vertical-align: middle; }
  td.acts { text-align: right; white-space: nowrap; }
  td.acts form { margin: 0; display: inline; }
  details.mod { margin: .5rem 0; padding: .6rem 1.2rem; }
  details.mod summary { cursor: pointer; }
  details.mod .fields { margin-top: .8rem; }
  .preview { margin-top: .8rem; border-top: 1px solid var(--line); padding-top: .6rem; }
  table.list a { color: inherit; text-decoration: none; }
  table.list a:hover { text-decoration: underline; }
  input:disabled { opacity: .6; }
  .defaultbtn { position: absolute; left: -9999px; }
  @media (max-width: 640px) {
    header { flex-wrap: nowrap; gap: .6rem; padding: .5rem .7rem; }
    header strong span.brand { display: none; }
    header nav { overflow-x: auto; flex: 1; }
    header .sp { display: none; }
    header .lang { display: none; }
    header nav a { padding: .2rem .4rem; }
    header form button { padding: .2rem .5rem; font-size: .9rem; }
    main { margin-top: 1rem; }
    .status-hat { font-size: 1.3rem; }
    .nav2 { flex-wrap: wrap; }
    .nav2 .t { order: -1; flex-basis: 100%; }
    table.list tr { display: flex; flex-wrap: wrap; gap: .3rem; padding: .4rem 0; border-bottom: 1px solid var(--line); }
    table.list td { border: 0; padding: .1rem .3rem; }
    td.acts { text-align: left; width: 100%; }
    .actrow input[type=text] { flex-basis: 100%; }
    .trow { grid-template-columns: 7rem 1fr 4.5rem; gap: .5rem; }
  }
  .newhat { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .6rem; }
  details.yaml { margin-top: 2rem; }
  details.yaml summary { cursor: pointer; }
  details.yaml > div { margin-top: .8rem; }
  .desc { margin-left: 1.1rem; }
  .ivlist { padding: .3rem .6rem; }
  details.iv { border-bottom: 1px solid var(--line); }
  details.iv:last-child { border-bottom: 0; }
  details.iv summary { display: grid; grid-template-columns: 7.5rem 1fr 4.5rem 1.6rem; gap: .5rem; align-items: center; padding: .45rem .3rem; cursor: pointer; list-style: none; border-radius: .4rem; }
  details.iv summary::-webkit-details-marker { display: none; }
  details.iv summary:hover { background: color-mix(in srgb, var(--c, #888) 12%, transparent); }
  details.iv[open] summary { background: color-mix(in srgb, var(--c, #888) 16%, transparent); }
  details.iv.gap summary { grid-template-columns: 7.5rem 1fr 4.5rem auto; font-style: italic; }
  .ivtime { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ivedit { color: var(--dim); text-align: right; }
  .ivform { display: flex; flex-wrap: wrap; gap: .6rem; align-items: flex-end; padding: .7rem .3rem 1rem; }
  .ivform label { display: flex; flex-direction: column; gap: .2rem; font-size: .85rem; color: var(--dim); }
  .ivform label > * { color: var(--fg); }
  .ivform .grow select { width: 100%; }
  .ivbtns { display: flex; gap: .4rem; }
  input[type=time] { font: inherit; padding: .3rem .5rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--bg); color: inherit; }
  button.danger { color: #c33; border-color: #c335; }
  button.danger:hover { background: #c331; border-color: #c33; }
  details.add { margin-top: 1rem; }
  details.add summary { cursor: pointer; }
  .undo { margin: 0 0 1rem; }
  .small { font-size: .85rem; }
  .crumbs { display: flex; gap: .5rem; align-items: center; margin-bottom: .6rem; font-size: .95rem; }
  .crumbs a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: .3rem; }
  .crumbs a:hover { text-decoration: underline; }
  .hathero { margin-bottom: 1rem; }
  .hatpage .card { border-left: 3px solid color-mix(in srgb, var(--c) 70%, transparent); }
  .hatpage h1 { color: color-mix(in srgb, var(--c) 55%, var(--fg)); }
  .keytag { font-size: .8rem; font-weight: 400; border: 1px solid var(--line); border-radius: .4rem; padding: 0 .4rem; vertical-align: middle; }
  .namerow { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
  .namerow label { display: flex; flex-direction: column; gap: .2rem; font-size: .9rem; color: var(--dim); }
  .namerow label > * { color: var(--fg); }
  fieldset.radios { border: 0; padding: 0; margin: 1rem 0 0; display: flex; flex-direction: column; gap: .3rem; }
  fieldset.radios legend { font-size: .9rem; color: var(--dim); margin-bottom: .3rem; padding: 0; }
  fieldset.radios label { display: flex; gap: .5rem; align-items: center; cursor: pointer; }
  .daybar2 { height: 2.2rem; }
  .bar b.off { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--bg) 55%, transparent) 0 5px, color-mix(in srgb, var(--bg) 25%, transparent) 5px 10px); pointer-events: none; }
  .ticks { position: relative; height: 1.1rem; font-size: .75rem; color: var(--dim); }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }
  .worknote { display: flex; align-items: center; gap: .4rem; margin: .3rem 0 0; }
  .offkey { display: inline-block; width: 1.4rem; height: .8rem; border-radius: .2rem; background: var(--line) repeating-linear-gradient(135deg, color-mix(in srgb, var(--bg) 55%, transparent) 0 3px, transparent 3px 6px); }
  .days { display: flex; gap: .9rem; flex-wrap: wrap; margin-top: .8rem; }
  .days label { display: inline-flex; gap: .3rem; align-items: center; }
  details.archived summary { cursor: pointer; }
  details.card.archived { margin-top: 1.5rem; }
  .gallery { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .5rem; max-height: 22rem; overflow-y: auto; padding: .2rem; }
  .thumb { display: flex; flex-direction: column; gap: .2rem; cursor: pointer; border: 2px solid transparent; border-radius: .5rem; padding: .2rem; font-size: .75rem; color: var(--dim); }
  .thumb input { position: absolute; opacity: 0; pointer-events: none; }
  .thumb img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: .35rem; background: var(--line); }
  .thumb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb:hover { border-color: var(--line); }
  .thumb.on { border-color: #2fa7e0; color: var(--fg); }
  pre { background: var(--bg); padding: .5rem; border-radius: .4rem; overflow: auto; }
</style>
</head>
<body{{if .Live}} data-live="1"{{end}}>
<header>
  <strong style="display:flex;align-items:center;gap:.5rem"><img src="/static/hatrack.svg" width="26" height="26" alt=""><span class="brand">HatRack</span></strong>
  <nav>{{range .Nav}}<a href="{{.Href}}"{{if .Active}} class="on"{{end}}>{{.Label}}</a>{{end}}</nav>
  <span class="sp"></span>
  <span class="lang"><a href="?lang=en">EN</a> <a href="?lang=de">DE</a></span>
  {{if .CanWrite}}<form method="post" action="/logout"><button>{{t .Lang "ui.logout"}}</button></form>{{end}}
</header>
<main>
{{if .Err}}<div class="err">{{.Err}}</div>{{end}}
{{if .Msg}}<div class="ok">{{.Msg}}</div>{{end}}
{{template "content" .}}
</main>
<script src="/static/app.js"></script>
</body>
</html>{{end}}
