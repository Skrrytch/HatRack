{{define "modforms"}}
{{range .}}
<details class="card mod"{{if .Open}} open{{end}}>
  <summary><strong>{{.Title}}</strong> <span class="dim">– {{.Summary}}</span>{{if .Desc}}<br><small class="dim desc">{{.Desc}}</small>{{end}}</summary>
  <div class="fields">
  {{range .Fields}}
    <label>{{.Label}}{{if .Required}} *{{end}}
    {{if or (eq .Kind "bool") (eq .Kind "enum")}}
      <select name="{{.Name}}">{{range .Options}}<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>{{end}}</select>
    {{else if eq .Kind "number"}}
      <input type="number" step="any" name="{{.Name}}" value="{{.Value}}"{{if .Inherited}} placeholder="{{.Inherited}}"{{end}}>
    {{else}}
      <input type="text" name="{{.Name}}" value="{{.Value}}"{{if .Inherited}} placeholder="{{.Inherited}}"{{end}}>
    {{end}}
    </label>
  {{end}}
  </div>
  {{if .Extra}}<p class="dim">{{.ExtraNote}}</p><pre>{{.Extra}}</pre>{{end}}
</details>
{{end}}
{{end}}
